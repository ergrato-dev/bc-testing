<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="sans-serif">
  <title>IDOR: luis cambia el id de la URL y pide el préstamo de ana</title>
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="20" text-anchor="middle">IDOR: cambiar un número de la URL</text>

  <!-- luis -->
  <rect x="30" y="70" width="170" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="100" fill="#58a6ff" font-size="16" text-anchor="middle">luis</text>
  <text x="115" y="122" fill="#c9d1d9" font-size="12" text-anchor="middle" font-family="monospace">luis-token</text>

  <!-- peticiones -->
  <text x="245" y="88" fill="#c9d1d9" font-size="13" font-family="monospace">GET /api/loans/2</text>
  <text x="245" y="128" fill="#d29922" font-size="13" font-family="monospace">GET /api/loans/1</text>
  <line x1="200" y1="95" x2="420" y2="95" stroke="#3fb950" stroke-width="2"/>
  <polygon points="420,89 432,95 420,101" fill="#3fb950"/>
  <line x1="200" y1="135" x2="420" y2="135" stroke="#d29922" stroke-width="2"/>
  <polygon points="420,129 432,135 420,141" fill="#d29922"/>

  <!-- API -->
  <rect x="435" y="60" width="200" height="100" rx="8" fill="#161b22" stroke="#00ADD8" stroke-width="2"/>
  <text x="535" y="90" fill="#c9d1d9" font-size="15" text-anchor="middle">API</text>
  <text x="535" y="114" fill="#c9d1d9" font-size="12" text-anchor="middle">¿token válido? sí</text>
  <text x="535" y="134" fill="#f85149" font-size="12" text-anchor="middle">¿es suyo? no lo mira</text>

  <!-- tabla loans -->
  <rect x="680" y="60" width="190" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="775" y="84" fill="#c9d1d9" font-size="14" text-anchor="middle">loans</text>
  <text x="700" y="112" fill="#c9d1d9" font-size="13" font-family="monospace">1  libro 1  ana</text>
  <text x="700" y="138" fill="#c9d1d9" font-size="13" font-family="monospace">2  libro 3  luis</text>
  <line x1="635" y1="110" x2="672" y2="110" stroke="#30363d" stroke-width="2"/>

  <!-- Antes / después -->
  <rect x="30" y="200" width="400" height="160" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="230" y="228" fill="#f85149" font-size="15" text-anchor="middle">Sin comprobar el dueño</text>
  <text x="60" y="262" fill="#c9d1d9" font-size="13" font-family="monospace">/api/loans/1 → 200 (el de ana)</text>
  <text x="60" y="290" fill="#c9d1d9" font-size="13" font-family="monospace">/api/loans/2 → 200</text>
  <text x="60" y="318" fill="#c9d1d9" font-size="13" font-family="monospace">/api/loans/3 → 404</text>
  <text x="230" y="346" fill="#8b949e" font-size="12" text-anchor="middle">luis ve datos ajenos y sabe qué ids existen</text>

  <rect x="470" y="200" width="400" height="160" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="670" y="228" fill="#3fb950" font-size="15" text-anchor="middle">Dueño o administrador</text>
  <text x="500" y="262" fill="#c9d1d9" font-size="13" font-family="monospace">/api/loans/1 → 404</text>
  <text x="500" y="290" fill="#c9d1d9" font-size="13" font-family="monospace">/api/loans/2 → 200</text>
  <text x="500" y="318" fill="#c9d1d9" font-size="13" font-family="monospace">/api/loans/3 → 404</text>
  <text x="670" y="346" fill="#8b949e" font-size="12" text-anchor="middle">ajeno e inexistente responden igual</text>
</svg>
