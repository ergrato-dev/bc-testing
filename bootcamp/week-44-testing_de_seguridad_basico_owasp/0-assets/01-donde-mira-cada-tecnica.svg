<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
  <title>Dónde mira cada técnica: tests en el código, ZAP desde fuera y auditores en el lockfile</title>
  <rect width="900" height="420" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="20" text-anchor="middle">Dónde mira cada técnica</text>

  <!-- Aplicación -->
  <rect x="300" y="70" width="300" height="270" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="96" fill="#c9d1d9" font-size="15" text-anchor="middle">La API en marcha</text>
  <rect x="325" y="112" width="250" height="44" rx="6" fill="#0d1117" stroke="#00ADD8"/>
  <text x="450" y="139" fill="#c9d1d9" font-size="13" text-anchor="middle">HTTP: rutas, cabeceras, errores</text>
  <rect x="325" y="168" width="250" height="44" rx="6" fill="#0d1117" stroke="#00ADD8"/>
  <text x="450" y="195" fill="#c9d1d9" font-size="13" text-anchor="middle">Tu código: handlers, permisos, SQL</text>
  <rect x="325" y="224" width="250" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="450" y="251" fill="#c9d1d9" font-size="13" text-anchor="middle">PostgreSQL</text>
  <rect x="325" y="280" width="250" height="44" rx="6" fill="#0d1117" stroke="#d29922"/>
  <text x="450" y="300" fill="#c9d1d9" font-size="13" text-anchor="middle">Dependencias (lockfile)</text>
  <text x="450" y="316" fill="#8b949e" font-size="11" text-anchor="middle" font-family="monospace">go.sum · uv.lock · pom.xml</text>

  <!-- ZAP -->
  <rect x="30" y="100" width="210" height="80" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="135" y="128" fill="#58a6ff" font-size="15" text-anchor="middle">ZAP (DAST)</text>
  <text x="135" y="150" fill="#c9d1d9" font-size="12" text-anchor="middle">Solo ve las respuestas,</text>
  <text x="135" y="166" fill="#c9d1d9" font-size="12" text-anchor="middle">como un atacante</text>
  <line x1="240" y1="134" x2="322" y2="134" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="322,128 334,134 322,140" fill="#58a6ff"/>

  <!-- Tests -->
  <rect x="30" y="200" width="210" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="135" y="228" fill="#3fb950" font-size="15" text-anchor="middle">Tests de seguridad</text>
  <text x="135" y="250" fill="#c9d1d9" font-size="12" text-anchor="middle">Usuarios y datos preparados:</text>
  <text x="135" y="266" fill="#c9d1d9" font-size="12" text-anchor="middle">IDOR, 401/403, inyección</text>
  <line x1="240" y1="230" x2="322" y2="196" stroke="#3fb950" stroke-width="2"/>
  <polygon points="318,190 332,193 322,203" fill="#3fb950"/>

  <!-- Auditores -->
  <rect x="660" y="260" width="210" height="80" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="765" y="288" fill="#d29922" font-size="15" text-anchor="middle">Auditores (SCA)</text>
  <text x="765" y="310" fill="#c9d1d9" font-size="12" text-anchor="middle">Versiones contra una base</text>
  <text x="765" y="326" fill="#c9d1d9" font-size="12" text-anchor="middle">de CVE publicados</text>
  <line x1="660" y1="302" x2="578" y2="302" stroke="#d29922" stroke-width="2"/>
  <polygon points="578,296 566,302 578,308" fill="#d29922"/>

  <!-- Base de CVE -->
  <rect x="660" y="100" width="210" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="765" y="128" fill="#c9d1d9" font-size="14" text-anchor="middle">osv.dev · RustSec</text>
  <text x="765" y="150" fill="#c9d1d9" font-size="14" text-anchor="middle">vuln.go.dev · GitHub</text>
  <text x="765" y="168" fill="#8b949e" font-size="11" text-anchor="middle">cambian cada día</text>
  <line x1="765" y1="180" x2="765" y2="254" stroke="#30363d" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="759,252 765,264 771,252" fill="#30363d"/>

  <text x="450" y="380" fill="#f85149" font-size="13" text-anchor="middle">Ninguna ve todo: ZAP no sabe de quién es el préstamo 1; un test no sabe del CVE de ayer.</text>
</svg>
