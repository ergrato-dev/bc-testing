<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="sans-serif">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="38" fill="#c9d1d9" font-size="22" text-anchor="middle" font-weight="bold">Una tabla, un test por fila</text>

  <rect x="30" y="70" width="410" height="290" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="98" fill="#F7DF1E" font-size="15" font-weight="bold">tests/visitor.test.js</text>
  <g font-family="monospace" font-size="14" fill="#c9d1d9">
    <text x="50" y="132">it.each([</text>
    <text x="70" y="158" fill="#8b949e">// TC-PLAN-REG-010</text>
    <text x="70" y="182" fill="#58a6ff">{ age: 4 },</text>
    <text x="70" y="208" fill="#8b949e">// TC-PLAN-REG-015</text>
    <text x="70" y="232" fill="#58a6ff">{ age: 100 },</text>
    <text x="70" y="258" fill="#8b949e">// TC-PLAN-REG-016</text>
    <text x="70" y="282" fill="#58a6ff">{ age: 10.5 },</text>
    <text x="50" y="310">])("should return the age message</text>
    <text x="70" y="334">when the age is <tspan fill="#d29922">$age</tspan>", ...)</text>
  </g>

  <g stroke="#3fb950" stroke-width="2" fill="none">
    <path d="M 440 178 L 500 140"/>
    <path d="M 440 228 L 500 215"/>
    <path d="M 440 278 L 500 290"/>
  </g>
  <g fill="#3fb950">
    <polygon points="500,140 490,141 495,149"/>
    <polygon points="500,215 491,211 491,220"/>
    <polygon points="500,290 495,281 490,289"/>
  </g>

  <g font-size="14">
    <rect x="505" y="112" width="370" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="520" y="136" fill="#3fb950" font-family="monospace">✓</text>
    <text x="540" y="136" fill="#c9d1d9">should return the age message</text>
    <text x="540" y="156" fill="#c9d1d9">when the age is <tspan fill="#d29922">4</tspan></text>

    <rect x="505" y="188" width="370" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="520" y="212" fill="#3fb950" font-family="monospace">✓</text>
    <text x="540" y="212" fill="#c9d1d9">should return the age message</text>
    <text x="540" y="232" fill="#c9d1d9">when the age is <tspan fill="#d29922">100</tspan></text>

    <rect x="505" y="264" width="370" height="54" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="520" y="288" fill="#3fb950" font-family="monospace">✓</text>
    <text x="540" y="288" fill="#c9d1d9">should return the age message</text>
    <text x="540" y="308" fill="#c9d1d9">when the age is <tspan fill="#d29922">10.5</tspan></text>
  </g>
  <text x="690" y="350" fill="#8b949e" font-size="13" text-anchor="middle">Jest cuenta 3 tests; grep solo ve un it.each</text>
  <text x="235" y="385" fill="#8b949e" font-size="13" text-anchor="middle">El ID va encima de la fila, como encima de un it</text>
</svg>
