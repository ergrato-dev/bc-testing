<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="sans-serif">
  <rect width="900" height="500" fill="#0d1117" rx="12"/>

  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#c9d1d9">Ciclo de un test con JUnit y Maven</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#8b949e">Escribir, ejecutar, leer el resultado y corregir</text>

  <!-- Pasos -->
  <rect x="60" y="120" width="170" height="70" rx="10" fill="#161b22" stroke="#F89820" stroke-width="2"/>
  <text x="145" y="146" text-anchor="middle" font-size="13" fill="#58a6ff" font-weight="700">1. Escribir el test</text>
  <text x="145" y="168" text-anchor="middle" font-size="12" fill="#c9d1d9" font-family="monospace">@Test · assertEquals</text>

  <rect x="270" y="120" width="170" height="70" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="355" y="146" text-anchor="middle" font-size="13" fill="#58a6ff" font-weight="700">2. Ejecutar</text>
  <text x="355" y="168" text-anchor="middle" font-size="12" fill="#c9d1d9" font-family="monospace">mvn test</text>

  <rect x="480" y="120" width="170" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="565" y="146" text-anchor="middle" font-size="13" fill="#3fb950" font-weight="700">3. Leer el resultado</text>
  <text x="565" y="168" text-anchor="middle" font-size="12" fill="#c9d1d9">Results de Surefire</text>

  <rect x="690" y="120" width="150" height="70" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="765" y="146" text-anchor="middle" font-size="13" fill="#d29922" font-weight="700">4. Corregir</text>
  <text x="765" y="168" text-anchor="middle" font-size="12" fill="#c9d1d9">el código o el test</text>

  <!-- Flechas -->
  <line x1="230" y1="155" x2="262" y2="155" stroke="#30363d" stroke-width="2"/>
  <polygon points="270,155 260,149 260,161" fill="#8b949e"/>
  <line x1="440" y1="155" x2="472" y2="155" stroke="#30363d" stroke-width="2"/>
  <polygon points="480,155 470,149 470,161" fill="#8b949e"/>
  <line x1="650" y1="155" x2="682" y2="155" stroke="#30363d" stroke-width="2"/>
  <polygon points="690,155 680,149 680,161" fill="#8b949e"/>

  <!-- Vuelta -->
  <path d="M765 190 C765 250 355 250 355 198" fill="none" stroke="#f85149" stroke-width="2"/>
  <polygon points="355,190 349,201 361,201" fill="#f85149"/>
  <text x="560" y="268" text-anchor="middle" font-size="12" fill="#f85149">Mientras no salga BUILD SUCCESS: corregir y volver a ejecutar</text>

  <!-- Cuatro resultados -->
  <rect x="40" y="300" width="190" height="130" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="135" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">Pasa</text>
  <text x="52" y="352" font-size="12" fill="#c9d1d9">Cada assert se cumplió.</text>
  <text x="52" y="374" font-size="11" fill="#c9d1d9" font-family="monospace">Failures: 0, Errors: 0</text>
  <text x="52" y="400" font-size="12" fill="#8b949e">Sigue con el siguiente caso.</text>

  <rect x="250" y="300" width="190" height="130" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="345" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#f85149">Failure</text>
  <text x="262" y="352" font-size="12" fill="#c9d1d9">Un assert no se cumplió.</text>
  <text x="262" y="374" font-size="11" fill="#c9d1d9" font-family="monospace">expected: &lt;5&gt;</text>
  <text x="262" y="390" font-size="11" fill="#c9d1d9" font-family="monospace">but was: &lt;-1&gt;</text>
  <text x="262" y="414" font-size="12" fill="#8b949e">Compara esperado y obtenido.</text>

  <rect x="460" y="300" width="190" height="130" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="555" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#d29922">Error</text>
  <text x="472" y="352" font-size="12" fill="#c9d1d9">Una excepción cortó el test</text>
  <text x="472" y="370" font-size="12" fill="#c9d1d9">antes de comprobar.</text>
  <text x="472" y="392" font-size="11" fill="#c9d1d9" font-family="monospace">» IllegalArgument</text>
  <text x="472" y="414" font-size="12" fill="#8b949e">Mira la primera línea at.</text>

  <rect x="670" y="300" width="190" height="130" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="765" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#58a6ff">No compila</text>
  <text x="682" y="352" font-size="12" fill="#c9d1d9">No se ejecuta ningún test.</text>
  <text x="682" y="374" font-size="11" fill="#c9d1d9" font-family="monospace">COMPILATION ERROR</text>
  <text x="682" y="400" font-size="12" fill="#8b949e">Revisa imports y pom.xml.</text>

  <text x="450" y="470" text-anchor="middle" font-size="12" fill="#8b949e">Semana 05 · Java con JUnit 6 y Maven</text>
</svg>
