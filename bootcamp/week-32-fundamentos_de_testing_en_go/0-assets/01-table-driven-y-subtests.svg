<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="sans-serif">
  <rect width="880" height="420" fill="#0d1117"/>
  <text x="440" y="34" fill="#c9d1d9" font-size="20" text-anchor="middle">Una fila de la tabla, un subtest</text>

  <!-- Tabla -->
  <rect x="30" y="60" width="360" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="88" fill="#00ADD8" font-size="15">tests := []struct{...}</text>
  <text x="50" y="122" fill="#8b949e" font-size="13" font-family="monospace">name                  days  m        want</text>
  <line x1="50" y1="132" x2="370" y2="132" stroke="#30363d"/>
  <text x="50" y="160" fill="#c9d1d9" font-size="13" font-family="monospace">"basic three days"     3   Basic     150</text>
  <text x="50" y="195" fill="#c9d1d9" font-size="13" font-family="monospace">"basic capped"        30   Basic    1000</text>
  <text x="50" y="230" fill="#c9d1d9" font-size="13" font-family="monospace">"premium within grace" 2   Premium     0</text>
  <text x="50" y="285" fill="#8b949e" font-size="13" font-family="monospace">for _, tt := range tests {</text>
  <text x="50" y="302" fill="#8b949e" font-size="13" font-family="monospace">  t.Run(tt.name, func(t) {...})</text>

  <!-- Flechas -->
  <line x1="390" y1="156" x2="500" y2="156" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="500,151 510,156 500,161" fill="#58a6ff"/>
  <line x1="390" y1="191" x2="500" y2="191" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="500,186 510,191 500,196" fill="#58a6ff"/>
  <line x1="390" y1="226" x2="500" y2="226" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="500,221 510,226 500,231" fill="#58a6ff"/>
  <text x="450" y="140" fill="#8b949e" font-size="12" text-anchor="middle">t.Run</text>

  <!-- Subtests -->
  <rect x="510" y="60" width="340" height="250" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="530" y="88" fill="#00ADD8" font-size="15">go test -v</text>
  <text x="530" y="122" fill="#c9d1d9" font-size="13" font-family="monospace">TestLateFee</text>
  <text x="545" y="160" fill="#3fb950" font-size="13" font-family="monospace">├─ basic_three_days</text>
  <text x="545" y="195" fill="#3fb950" font-size="13" font-family="monospace">├─ basic_capped</text>
  <text x="545" y="230" fill="#3fb950" font-size="13" font-family="monospace">└─ premium_within_grace</text>
  <text x="530" y="285" fill="#8b949e" font-size="12">Los espacios del nombre pasan a _</text>
  <text x="530" y="302" fill="#8b949e" font-size="12">Un t.Fatalf termina solo su subtest</text>

  <!-- Filtro -->
  <rect x="30" y="335" width="820" height="60" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="50" y="361" fill="#d29922" font-size="14" font-family="monospace">go test -run '^TestLateFee$/premium'</text>
  <text x="50" y="383" fill="#c9d1d9" font-size="13">Una expresión regular por nivel, separadas por /. Solo se ejecuta premium_within_grace.</text>
</svg>
