[project]
name = "week17-ejercicio02-solution"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest]
pythonpath = ["."]
# PASO 1: registrar marks y activar el modo estricto
strict = true
markers = [
    "smoke: pruebas críticas de validación rápida",
    "regression: pruebas de cobertura funcional amplia",
    "slow: pruebas de mayor costo de ejecución",
]
