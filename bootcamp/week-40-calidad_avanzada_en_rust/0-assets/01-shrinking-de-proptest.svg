<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="sans-serif">
  <rect width="900" height="430" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="20" font-weight="bold" text-anchor="middle">Cómo reduce proptest una entrada que falla</text>
  <text x="450" y="58" fill="#8b949e" font-size="13" text-anchor="middle">Búsqueda binaria hacia 0 en cada parámetro, mientras la propiedad siga fallando</text>

  <!-- Fila 1: fallo monótono -->
  <text x="30" y="98" fill="#3fb950" font-size="15" font-weight="bold">El fallo crece con el número: format_code(prefix, number)</text>
  <text x="30" y="118" fill="#8b949e" font-size="12">Falla con cualquier number ≥ 1000</text>

  <rect x="30" y="132" width="190" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="125" y="160" fill="#c9d1d9" font-size="13" text-anchor="middle">Entrada generada</text>
  <text x="125" y="182" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">number = 29706</text>

  <line x1="220" y1="167" x2="268" y2="167" stroke="#8b949e" stroke-width="2"/>
  <polygon points="268,161 280,167 268,173" fill="#8b949e"/>

  <rect x="280" y="132" width="250" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="405" y="160" fill="#c9d1d9" font-size="13" text-anchor="middle">Prueba la mitad, y la mitad...</text>
  <text x="405" y="182" fill="#c9d1d9" font-size="12" text-anchor="middle">1000 falla, 999 pasa</text>

  <line x1="530" y1="167" x2="578" y2="167" stroke="#8b949e" stroke-width="2"/>
  <polygon points="578,161 590,167 578,173" fill="#8b949e"/>

  <rect x="590" y="132" width="280" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="730" y="160" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">minimal failing input</text>
  <text x="730" y="182" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">number = 1000 (el mínimo real)</text>

  <!-- Fila 2: fallo no monótono -->
  <text x="30" y="258" fill="#d29922" font-size="15" font-weight="bold">El fallo depende del resto: split_fee(total, parts)</text>
  <text x="30" y="278" fill="#8b949e" font-size="12">Falla cuando total % parts ≥ 2: entre dos números que fallan hay muchos que pasan</text>

  <rect x="30" y="292" width="190" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="125" y="320" fill="#c9d1d9" font-size="13" text-anchor="middle">Entrada generada</text>
  <text x="125" y="342" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">total = ?, parts = 3</text>

  <line x1="220" y1="327" x2="268" y2="327" stroke="#8b949e" stroke-width="2"/>
  <polygon points="268,321 280,327 268,333" fill="#8b949e"/>

  <rect x="280" y="292" width="250" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="405" y="320" fill="#c9d1d9" font-size="13" text-anchor="middle">Prueba la mitad, y la mitad...</text>
  <text x="405" y="342" fill="#c9d1d9" font-size="12" text-anchor="middle">las mitades pasan: se para</text>

  <line x1="530" y1="327" x2="578" y2="327" stroke="#8b949e" stroke-width="2"/>
  <polygon points="578,321 590,327 578,333" fill="#8b949e"/>

  <rect x="590" y="292" width="280" height="70" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="730" y="320" fill="#d29922" font-size="13" font-weight="bold" text-anchor="middle">minimal failing input</text>
  <text x="730" y="342" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">total = 9386 (el mínimo real es 2)</text>

  <text x="450" y="405" fill="#8b949e" font-size="13" text-anchor="middle">«minimal» es un mínimo local: una entrada que falla, no siempre la más simple</text>
</svg>
