<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#0f172a" rx="12"/>
  <text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">De la conversación al feature ejecutable</text>
  <text x="460" y="64" text-anchor="middle" font-size="13" fill="#94a3b8">BDD empieza con ejemplos acordados, no con código</text>
  <g font-size="12" fill="#f1f5f9">
    <rect x="30" y="100" width="200" height="170" rx="10" fill="#1e293b" stroke="#6366f1"/>
    <text x="130" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#a5b4fc">1. Tres amigos</text>
    <text x="130" y="156" text-anchor="middle">negocio · desarrollo · testing</text>
    <text x="130" y="186" text-anchor="middle">Regla: la sala cierra a las 18</text>
    <text x="130" y="210" text-anchor="middle" fill="#FFD43B">¿Y a las 18?</text>
    <text x="130" y="240" text-anchor="middle">17 sí · 18 no</text>
    <rect x="260" y="100" width="190" height="170" rx="10" fill="#1e293b" stroke="#3572A5"/>
    <text x="355" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD43B">2. Feature</text>
    <text x="355" y="156" text-anchor="middle" font-family="ui-monospace, monospace">Esquema del escenario</text>
    <text x="355" y="182" text-anchor="middle" font-family="ui-monospace, monospace">| hora | resultado |</text>
    <text x="355" y="204" text-anchor="middle" font-family="ui-monospace, monospace">| 17   | aceptada  |</text>
    <text x="355" y="226" text-anchor="middle" font-family="ui-monospace, monospace">| 18   | rechazada |</text>
    <rect x="480" y="100" width="190" height="170" rx="10" fill="#1e293b" stroke="#3572A5"/>
    <text x="575" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD43B">3. Steps</text>
    <text x="575" y="160" text-anchor="middle" font-size="10.5" font-family="ui-monospace, monospace">@when('... a las {hour:d}')</text>
    <text x="575" y="190" text-anchor="middle">conectan cada frase</text>
    <text x="575" y="212" text-anchor="middle">con el código</text>
    <rect x="700" y="100" width="190" height="170" rx="10" fill="#1e293b" stroke="#3572A5"/>
    <text x="795" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD43B">4. Código</text>
    <text x="795" y="160" text-anchor="middle" font-family="ui-monospace, monospace">calendar.book(...)</text>
    <text x="795" y="190" text-anchor="middle">el escenario falla</text>
    <text x="795" y="212" text-anchor="middle">hasta que la regla</text>
    <text x="795" y="234" text-anchor="middle">está implementada</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="230" y1="185" x2="256" y2="185"/>
    <line x1="450" y1="185" x2="476" y2="185"/>
    <line x1="670" y1="185" x2="696" y2="185"/>
  </g>
  <rect x="30" y="310" width="860" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Documentación viva</text>
  <text x="460" y="366" text-anchor="middle" font-size="13" fill="#cbd5e1">El feature lo lee negocio y lo ejecuta la suite: si la regla cambia y nadie actualiza el feature,</text>
  <text x="460" y="388" text-anchor="middle" font-size="13" fill="#cbd5e1">el escenario falla. La documentación no puede quedar desactualizada sin que alguien lo note.</text>
  <text x="460" y="460" text-anchor="middle" font-size="13" fill="#94a3b8">BDD describe el comportamiento visible (negocio); TDD guía el diseño interno (código).</text>
</svg>
