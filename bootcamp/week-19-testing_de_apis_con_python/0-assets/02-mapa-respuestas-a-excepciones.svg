<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#0f172a" rx="12"/>
  <text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">De respuesta HTTP a resultado del dominio</text>
  <text x="460" y="64" text-anchor="middle" font-size="13" fill="#94a3b8">CatalogClient.get_piece(piece_id): un test por cada rama</text>
  <!-- inputs -->
  <g font-size="14" fill="#f1f5f9">
    <rect x="40" y="95" width="250" height="52" rx="8" fill="#1e293b" stroke="#3572A5"/>
    <text x="165" y="126" text-anchor="middle">200 + JSON completo</text>
    <rect x="40" y="165" width="250" height="52" rx="8" fill="#1e293b" stroke="#3572A5"/>
    <text x="165" y="196" text-anchor="middle">200 + JSON sin un campo</text>
    <rect x="40" y="235" width="250" height="52" rx="8" fill="#1e293b" stroke="#3572A5"/>
    <text x="165" y="266" text-anchor="middle">404</text>
    <rect x="40" y="305" width="250" height="52" rx="8" fill="#1e293b" stroke="#3572A5"/>
    <text x="165" y="336" text-anchor="middle">503 + cuerpo HTML</text>
    <rect x="40" y="375" width="250" height="52" rx="8" fill="#1e293b" stroke="#3572A5"/>
    <text x="165" y="406" text-anchor="middle">httpx2.ReadTimeout</text>
  </g>
  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="290" y1="121" x2="560" y2="121"/>
    <line x1="290" y1="191" x2="560" y2="191"/>
    <line x1="290" y1="261" x2="560" y2="261"/>
    <line x1="290" y1="331" x2="560" y2="331"/>
    <line x1="290" y1="401" x2="560" y2="401"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="425" y="113">Piece.model_validate</text>
    <text x="425" y="183">Piece.model_validate</text>
    <text x="425" y="253">status_code == 404</text>
    <text x="425" y="323">status_code &gt;= 500</text>
    <text x="425" y="393">except TimeoutException</text>
  </g>
  <!-- outputs -->
  <g font-size="14" fill="#f1f5f9">
    <rect x="565" y="95" width="315" height="52" rx="8" fill="#14532d" stroke="#22c55e"/>
    <text x="722" y="126" text-anchor="middle">✓ Piece</text>
    <rect x="565" y="165" width="315" height="52" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="722" y="196" text-anchor="middle">✗ pydantic.ValidationError</text>
    <rect x="565" y="235" width="315" height="52" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="722" y="266" text-anchor="middle">✗ PieceNotFoundError</text>
    <rect x="565" y="305" width="315" height="52" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="722" y="336" text-anchor="middle">✗ CatalogUnavailableError</text>
    <rect x="565" y="375" width="315" height="52" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="722" y="406" text-anchor="middle">✗ CatalogUnavailableError</text>
  </g>
  <text x="460" y="468" text-anchor="middle" font-size="13" fill="#cbd5e1">Quien llama al cliente nunca ve un código HTTP ni una excepción de httpx2.</text>
</svg>
