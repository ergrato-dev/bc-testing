<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="sans-serif">
  <title>Page Object Model y fixtures</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0d1117"/>
  <text x="450" y="34" text-anchor="middle" fill="#c9d1d9" font-size="20" font-weight="bold">Cada capa sabe una cosa</text>

  <!-- Tests -->
  <rect x="20" y="70" width="260" height="130" rx="8" fill="#161b22" stroke="#F7DF1E"/>
  <text x="150" y="98" text-anchor="middle" fill="#c9d1d9" font-size="16" font-weight="bold">Tests</text>
  <text x="150" y="120" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">tests/lending.spec.ts</text>
  <text x="40" y="150" fill="#c9d1d9" font-size="13">Qué hace el usuario y qué</text>
  <text x="40" y="170" fill="#c9d1d9" font-size="13">debe ver: pasos y expect</text>

  <!-- Fixtures -->
  <rect x="320" y="70" width="260" height="130" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="450" y="98" text-anchor="middle" fill="#c9d1d9" font-size="16" font-weight="bold">Fixtures</text>
  <text x="450" y="120" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">fixtures.ts</text>
  <text x="340" y="150" fill="#c9d1d9" font-size="13">Crean los page objects y los</text>
  <text x="340" y="170" fill="#c9d1d9" font-size="13">datos de cada test (por la API)</text>

  <!-- Page objects -->
  <rect x="620" y="70" width="260" height="130" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="750" y="98" text-anchor="middle" fill="#c9d1d9" font-size="16" font-weight="bold">Page objects</text>
  <text x="750" y="120" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">pages/book-page.ts</text>
  <text x="640" y="150" fill="#c9d1d9" font-size="13">Cómo se encuentra cada cosa</text>
  <text x="640" y="170" fill="#c9d1d9" font-size="13">en la página: los locators</text>

  <line x1="280" y1="135" x2="318" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="135" x2="618" y2="135" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Página -->
  <rect x="620" y="240" width="260" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="750" y="270" text-anchor="middle" fill="#c9d1d9" font-size="16" font-weight="bold">La página</text>
  <text x="750" y="292" text-anchor="middle" fill="#8b949e" font-size="12">botón «Prestar», estado, mensaje</text>
  <line x1="750" y1="200" x2="750" y2="238" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Qué cambia -->
  <rect x="20" y="240" width="560" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="268" fill="#c9d1d9" font-size="14" font-weight="bold">Cuando cambia la interfaz</text>
  <text x="40" y="294" fill="#c9d1d9" font-size="13">El botón «Guardar» pasa a llamarse «Añadir»: fallan 3 tests,</text>
  <text x="40" y="314" fill="#c9d1d9" font-size="13">pero el arreglo es una línea en</text>
  <text x="232" y="314" fill="#58a6ff" font-size="13" font-family="monospace">BookFormPage.save()</text>
  <text x="40" y="334" fill="#8b949e" font-size="13">Los tests no se tocan: el usuario sigue haciendo lo mismo.</text>

  <text x="20" y="396" fill="#8b949e" font-size="13">Si un test necesita un locator, falta un método o un campo en su page object.</text>
</svg>
