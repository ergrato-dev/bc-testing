<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
  <title id="title">Un PostgreSQL por ejecución de pytest</title>
  <desc id="desc">La fixture postgres_url, con scope session, arranca un contenedor postgres:18.7-alpine en un puerto libre, entrega la URL a todos los tests y borra el contenedor al terminar. Dentro del contenedor, la base de datos test la usan los tests de repositorio y la base de datos migrations los tests de Alembic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Un PostgreSQL por ejecución de pytest</text>

  <!-- timeline -->
  <rect x="30" y="60" width="400" height="70" rx="8" fill="#161b22" stroke="#3572A5" stroke-width="2"/>
  <text x="50" y="88" fill="#c9d1d9" font-family="sans-serif" font-size="15" font-weight="bold">1. Entrar en el with (una vez)</text>
  <text x="50" y="112" fill="#c9d1d9" font-family="monospace" font-size="13">PostgresContainer("postgres:18.7-alpine")</text>

  <path d="M230 130 L230 156" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="30" y="160" width="400" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="50" y="188" fill="#c9d1d9" font-family="sans-serif" font-size="15" font-weight="bold">2. Esperar a que acepte conexiones</text>
  <text x="50" y="212" fill="#8b949e" font-family="sans-serif" font-size="13">Descarga la imagen solo la primera vez</text>

  <path d="M230 230 L230 256" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="30" y="260" width="400" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="50" y="288" fill="#c9d1d9" font-family="sans-serif" font-size="15" font-weight="bold">3. yield get_connection_url()</text>
  <text x="50" y="312" fill="#c9d1d9" font-family="sans-serif" font-size="13">Todos los tests usan el mismo contenedor</text>

  <path d="M230 330 L230 356" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="30" y="360" width="400" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="50" y="388" fill="#c9d1d9" font-family="sans-serif" font-size="15" font-weight="bold">4. Salir del with</text>
  <text x="50" y="412" fill="#c9d1d9" font-family="sans-serif" font-size="13">Contenedor detenido y borrado (ryuk si se interrumpe)</text>

  <!-- container -->
  <path d="M430 295 L478 295" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="480" y="60" width="390" height="370" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="675" y="90" fill="#58a6ff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Contenedor Docker</text>
  <text x="675" y="114" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">localhost:&lt;puerto libre&gt;</text>

  <rect x="510" y="140" width="330" height="120" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="675" y="170" fill="#c9d1d9" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Base de datos test</text>
  <text x="675" y="196" fill="#c9d1d9" font-family="sans-serif" font-size="13" text-anchor="middle">Tests de repositorio</text>
  <text x="675" y="222" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">create_all + rollback por test</text>
  <text x="675" y="244" fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle">teorías 01 a 03</text>

  <rect x="510" y="285" width="330" height="120" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="675" y="315" fill="#c9d1d9" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Base de datos migrations</text>
  <text x="675" y="341" fill="#c9d1d9" font-family="sans-serif" font-size="13" text-anchor="middle">Tests de migraciones</text>
  <text x="675" y="367" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">upgrade, check, downgrade</text>
  <text x="675" y="389" fill="#8b949e" font-family="sans-serif" font-size="12" text-anchor="middle">teoría 04</text>
</svg>
