<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Capas de fixtures y rollback por test</title>
  <desc id="desc">El engine y el esquema se crean una vez por sesión de pytest. Cada test abre una transacción externa; los commit y rollback del código actúan sobre savepoints, y al final la transacción externa se deshace.</desc>
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Rollback por test con savepoints</text>

  <!-- scope session -->
  <rect x="30" y="56" width="840" height="390" rx="10" fill="#161b22" stroke="#3572A5" stroke-width="2"/>
  <text x="50" y="84" fill="#58a6ff" font-family="sans-serif" font-size="15" font-weight="bold">scope="session" · una vez por ejecución</text>
  <text x="50" y="106" fill="#c9d1d9" font-family="monospace" font-size="13">engine = create_engine(...)   Base.metadata.create_all(engine)</text>

  <!-- scope function -->
  <rect x="60" y="124" width="780" height="300" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="80" y="150" fill="#d29922" font-family="sans-serif" font-size="15" font-weight="bold">scope="function" · un test</text>
  <text x="80" y="174" fill="#c9d1d9" font-family="monospace" font-size="13">connection.begin()  →  transacción externa (de la fixture)</text>

  <!-- savepoint 1 -->
  <rect x="100" y="192" width="320" height="120" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="116" y="216" fill="#3fb950" font-family="sans-serif" font-size="14" font-weight="bold">SAVEPOINT 1</text>
  <text x="116" y="242" fill="#c9d1d9" font-family="monospace" font-size="13">repo.add(Book("Dune"))</text>
  <text x="116" y="266" fill="#c9d1d9" font-family="monospace" font-size="13">session.commit()</text>
  <text x="116" y="292" fill="#8b949e" font-family="sans-serif" font-size="13">RELEASE: "Dune" queda en la externa</text>

  <!-- savepoint 2 -->
  <rect x="480" y="192" width="320" height="120" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="496" y="216" fill="#f85149" font-family="sans-serif" font-size="14" font-weight="bold">SAVEPOINT 2</text>
  <text x="496" y="242" fill="#c9d1d9" font-family="monospace" font-size="13">repo.add(ISBN duplicado)</text>
  <text x="496" y="266" fill="#c9d1d9" font-family="monospace" font-size="13">session.rollback()</text>
  <text x="496" y="292" fill="#8b949e" font-family="sans-serif" font-size="13">ROLLBACK TO: solo se pierde el duplicado</text>

  <path d="M420 252 L476 252" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/>
    </marker>
  </defs>

  <!-- final rollback -->
  <rect x="100" y="332" width="700" height="70" rx="6" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="362" fill="#d29922" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">transaction.rollback()</text>
  <text x="450" y="386" fill="#c9d1d9" font-family="sans-serif" font-size="13" text-anchor="middle">Se deshace todo, también "Dune": el siguiente test empieza con la base de datos vacía</text>
</svg>
