<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
  <title id="title">La misma suite en SQLite y en PostgreSQL</title>
  <desc id="desc">Una fixture engine parametrizada ejecuta cada test en SQLite en memoria y en un PostgreSQL arrancado por Testcontainers. En el mismo contenedor, una base de datos vacía sirve para probar las migraciones de Alembic.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Una suite, dos motores</text>

  <!-- suite -->
  <rect x="300" y="56" width="300" height="64" rx="8" fill="#161b22" stroke="#3572A5" stroke-width="2"/>
  <text x="450" y="82" fill="#c9d1d9" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">tests/ (sin cambios)</text>
  <text x="450" y="104" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">params=["sqlite", "postgresql"]</text>

  <path d="M380 120 L230 168" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 120 L670 168" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="250" y="140" fill="#8b949e" font-family="monospace" font-size="13">-k sqlite</text>
  <text x="590" y="140" fill="#8b949e" font-family="monospace" font-size="13">-k postgresql</text>

  <!-- sqlite -->
  <rect x="40" y="172" width="380" height="180" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="60" y="200" fill="#58a6ff" font-family="sans-serif" font-size="16" font-weight="bold">SQLite en memoria</text>
  <text x="60" y="228" fill="#3fb950" font-family="sans-serif" font-size="14">✓ milisegundos, sin Docker</text>
  <text x="60" y="254" fill="#3fb950" font-family="sans-serif" font-size="14">✓ consultas, UNIQUE y CHECK</text>
  <text x="60" y="280" fill="#f85149" font-family="sans-serif" font-size="14">✗ no aplica la longitud de VARCHAR</text>
  <text x="60" y="306" fill="#f85149" font-family="sans-serif" font-size="14">✗ claves foráneas desactivadas por defecto</text>
  <text x="60" y="332" fill="#8b949e" font-family="sans-serif" font-size="13">Para iterar mientras escribes</text>

  <!-- postgres -->
  <rect x="480" y="172" width="380" height="180" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="500" y="200" fill="#3fb950" font-family="sans-serif" font-size="16" font-weight="bold">PostgreSQL con Testcontainers</text>
  <text x="500" y="228" fill="#c9d1d9" font-family="monospace" font-size="13">postgres:18.7-alpine, puerto libre</text>
  <text x="500" y="254" fill="#3fb950" font-family="sans-serif" font-size="14">✓ el mismo motor que producción</text>
  <text x="500" y="280" fill="#d29922" font-family="sans-serif" font-size="14">● 2–5 s por ejecución (scope session)</text>
  <text x="500" y="306" fill="#d29922" font-family="sans-serif" font-size="14">● necesita Docker en marcha</text>
  <text x="500" y="332" fill="#8b949e" font-family="sans-serif" font-size="13">Antes del PR y en CI</text>

  <!-- migrations db -->
  <path d="M670 352 L670 382" stroke="#c9d1d9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="480" y="386" width="380" height="50" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="670" y="408" fill="#d29922" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BD vacía "migrations" en el mismo contenedor</text>
  <text x="670" y="427" fill="#c9d1d9" font-family="monospace" font-size="13" text-anchor="middle">upgrade head · check · downgrade base</text>
</svg>
