<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="#0d1117"/>

  <text x="400" y="38" text-anchor="middle" fill="#c9d1d9" font-size="20" font-weight="700">La pirámide de testing</text>

  <!-- Unitarios (base) -->
  <polygon points="175,305 625,305 735,415 65,415" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <!-- Integración (medio) -->
  <polygon points="285,195 515,195 625,305 175,305" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <!-- E2E (cúspide) -->
  <polygon points="400,65 285,195 515,195" fill="#161b22" stroke="#f85149" stroke-width="2"/>

  <text x="400" y="150" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="700">E2E</text>
  <text x="400" y="172" text-anchor="middle" fill="#f85149" font-size="11">pocos · minutos · caros</text>

  <text x="400" y="243" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="700">Integración</text>
  <text x="400" y="263" text-anchor="middle" fill="#58a6ff" font-size="11">algunos · segundos</text>

  <text x="400" y="350" text-anchor="middle" fill="#c9d1d9" font-size="17" font-weight="700">Unitarios</text>
  <text x="400" y="372" text-anchor="middle" fill="#3fb950" font-size="11">muchos · milisegundos · baratos</text>

  <!-- Izquierda: cantidad -->
  <line x1="30" y1="92" x2="30" y2="408" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="80" text-anchor="middle" fill="#8b949e" font-size="11">Pocos</text>
  <text x="30" y="430" text-anchor="middle" fill="#8b949e" font-size="11">Muchos</text>

  <!-- Derecha: velocidad -->
  <line x1="770" y1="92" x2="770" y2="408" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="770" y="80" text-anchor="middle" fill="#8b949e" font-size="11">Lento</text>
  <text x="770" y="430" text-anchor="middle" fill="#8b949e" font-size="11">Rápido</text>
</svg>
