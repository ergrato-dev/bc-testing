# PostgreSQL de la API de la biblioteca. db/init.sql crea las tablas y los 100 000 libros
# la primera vez que arranca el contenedor; `docker compose down -v` borra el volumen y
# la próxima vez los vuelve a crear.
services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "127.0.0.1:55443:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U library -d library"]
      interval: 1s
      timeout: 3s
      retries: 60
