<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="sans-serif">
  <title>Aserciones normales frente a soft assertions</title>
  <rect width="860" height="380" fill="#0d1117"/>
  <text x="30" y="38" fill="#c9d1d9" font-size="20" font-weight="bold">Tres comprobaciones sobre el mismo libro, dos de ellas mal</text>

  <!-- hard -->
  <rect x="30" y="60" width="385" height="295" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="90" fill="#c9d1d9" font-size="16" font-weight="bold">assertThat (normal)</text>
  <rect x="50" y="108" width="345" height="44" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="66" y="136" fill="#3fb950" font-size="15">✓</text>
  <text x="90" y="136" fill="#c9d1d9" font-size="13" font-family="monospace">title  == "Dune"</text>
  <rect x="50" y="162" width="345" height="44" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="66" y="190" fill="#f85149" font-size="15">✗</text>
  <text x="90" y="190" fill="#c9d1d9" font-size="13" font-family="monospace">year   == 1966</text>
  <text x="250" y="190" fill="#f85149" font-size="13">lanza y para</text>
  <rect x="50" y="216" width="345" height="44" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="66" y="244" fill="#8b949e" font-size="15">–</text>
  <text x="90" y="244" fill="#8b949e" font-size="13" font-family="monospace">author == "Herbert"</text>
  <text x="270" y="244" fill="#8b949e" font-size="13">no se ejecuta</text>
  <text x="50" y="300" fill="#c9d1d9" font-size="14">Informe: 1 fallo.</text>
  <text x="50" y="322" fill="#8b949e" font-size="13">El segundo error aparece en la siguiente ejecución.</text>

  <!-- soft -->
  <rect x="445" y="60" width="385" height="295" rx="8" fill="#161b22" stroke="#F89820"/>
  <text x="465" y="90" fill="#F89820" font-size="16" font-weight="bold">softly.assertThat + assertAll</text>
  <rect x="465" y="108" width="345" height="44" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="481" y="136" fill="#3fb950" font-size="15">✓</text>
  <text x="505" y="136" fill="#c9d1d9" font-size="13" font-family="monospace">title  == "Dune"</text>
  <rect x="465" y="162" width="345" height="44" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="481" y="190" fill="#f85149" font-size="15">✗</text>
  <text x="505" y="190" fill="#c9d1d9" font-size="13" font-family="monospace">year   == 1966</text>
  <text x="665" y="190" fill="#d29922" font-size="13">se anota, sigue</text>
  <rect x="465" y="216" width="345" height="44" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="481" y="244" fill="#f85149" font-size="15">✗</text>
  <text x="505" y="244" fill="#c9d1d9" font-size="13" font-family="monospace">author == "Herbert"</text>
  <text x="685" y="244" fill="#d29922" font-size="13">se anota</text>
  <text x="465" y="300" fill="#c9d1d9" font-size="14">assertAll(): Multiple Failures (2 failures).</text>
  <text x="465" y="322" fill="#8b949e" font-size="13">Sin assertAll() el test pasa en verde.</text>
</svg>
