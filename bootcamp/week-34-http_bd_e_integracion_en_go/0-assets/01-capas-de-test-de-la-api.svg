<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#c9d1d9">Las capas de test de la API en Go</text>

  <!-- Panel izquierdo: -short -->
  <rect x="20" y="56" width="420" height="390" rx="10" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="230" y="84" text-anchor="middle" font-size="15" font-family="monospace" fill="#3fb950">go test -short ./...</text>
  <text x="230" y="104" text-anchor="middle" font-size="12" fill="#8b949e">sin Docker, en milisegundos</text>

  <text x="40" y="138" font-size="14" font-weight="bold" fill="#c9d1d9">Servidor: el handler</text>
  <rect x="40" y="150" width="80" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="177" text-anchor="middle" font-size="13" fill="#c9d1d9">test</text>
  <rect x="150" y="150" width="120" height="44" rx="6" fill="#161b22" stroke="#00ADD8"/>
  <text x="210" y="168" text-anchor="middle" font-size="11" font-family="monospace" fill="#00ADD8">NewRecorder</text>
  <text x="210" y="184" text-anchor="middle" font-size="11" fill="#c9d1d9">+ ServeMux</text>
  <rect x="300" y="150" width="120" height="44" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="360" y="168" text-anchor="middle" font-size="12" fill="#c9d1d9">servicio</text>
  <text x="360" y="184" text-anchor="middle" font-size="11" fill="#d29922">fake y mock</text>
  <line x1="120" y1="172" x2="148" y2="172" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="172" x2="298" y2="172" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="230" y="220" text-anchor="middle" font-size="12" fill="#8b949e">una llamada a ServeHTTP: no hay red</text>

  <text x="40" y="270" font-size="14" font-weight="bold" fill="#c9d1d9">Cliente: el código que llama</text>
  <rect x="40" y="282" width="80" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="309" text-anchor="middle" font-size="13" fill="#c9d1d9">Client</text>
  <rect x="150" y="282" width="120" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="210" y="300" text-anchor="middle" font-size="12" fill="#c9d1d9">TCP</text>
  <text x="210" y="316" text-anchor="middle" font-size="11" font-family="monospace" fill="#8b949e">127.0.0.1</text>
  <rect x="300" y="282" width="120" height="44" rx="6" fill="#161b22" stroke="#00ADD8"/>
  <text x="360" y="300" text-anchor="middle" font-size="11" font-family="monospace" fill="#00ADD8">NewServer</text>
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#d29922">stub o spy</text>
  <line x1="120" y1="304" x2="148" y2="304" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="304" x2="298" y2="304" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="230" y="352" text-anchor="middle" font-size="12" fill="#8b949e">conexión real a un servidor local</text>
  <text x="230" y="392" text-anchor="middle" font-size="12" fill="#8b949e">los tests lentos se saltan con</text>
  <text x="230" y="410" text-anchor="middle" font-size="12" font-family="monospace" fill="#c9d1d9">testing.Short()</text>

  <!-- Panel derecho: integración -->
  <rect x="460" y="56" width="420" height="390" rx="10" fill="none" stroke="#00ADD8" stroke-width="2"/>
  <text x="670" y="84" text-anchor="middle" font-size="15" font-family="monospace" fill="#00ADD8">go test -tags integration ./...</text>
  <text x="670" y="104" text-anchor="middle" font-size="12" fill="#8b949e">archivos con //go:build integration, con Docker</text>

  <rect x="480" y="122" width="380" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="670" y="147" text-anchor="middle" font-size="13" fill="#c9d1d9">TestMain arranca, migra y para el contenedor</text>

  <rect x="480" y="182" width="175" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="567" y="203" text-anchor="middle" font-size="13" fill="#c9d1d9">test A</text>
  <text x="567" y="222" text-anchor="middle" font-size="11" font-family="monospace" fill="#3fb950">BEGIN … ROLLBACK</text>
  <rect x="685" y="182" width="175" height="52" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="772" y="203" text-anchor="middle" font-size="13" fill="#c9d1d9">test B</text>
  <text x="772" y="222" text-anchor="middle" font-size="11" font-family="monospace" fill="#3fb950">BEGIN … ROLLBACK</text>

  <line x1="567" y1="234" x2="567" y2="284" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="772" y1="234" x2="772" y2="284" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="670" y="264" text-anchor="middle" font-size="11" fill="#8b949e">Store{DB: tx}</text>

  <rect x="480" y="286" width="380" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="670" y="312" text-anchor="middle" font-size="14" fill="#58a6ff">un contenedor para todo el paquete</text>
  <text x="670" y="334" text-anchor="middle" font-size="12" font-family="monospace" fill="#c9d1d9">postgres:18.7-alpine</text>
  <text x="670" y="350" text-anchor="middle" font-size="11" fill="#8b949e">esquema de migrations, incrustado con go:embed</text>

  <text x="670" y="392" text-anchor="middle" font-size="12" fill="#8b949e">cada test ve las tablas vacías:</text>
  <text x="670" y="410" text-anchor="middle" font-size="12" fill="#8b949e">nada de lo que escribe se confirma</text>
</svg>
