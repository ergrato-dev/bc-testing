<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="sans-serif">
  <title>verify.sh: la suite Go por fases</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#0d1117"/>
  <text x="450" y="34" text-anchor="middle" fill="#c9d1d9" font-size="20" font-weight="bold">verify.sh: cuatro fases, se para en la primera que falla</text>

  <!-- Fase 1 -->
  <rect x="20" y="70" width="190" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="115" y="96" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">1. Análisis</text>
  <text x="115" y="122" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">go vet</text>
  <text x="115" y="142" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">staticcheck</text>
  <text x="115" y="166" text-anchor="middle" fill="#8b949e" font-size="12">con y sin la tag</text>

  <!-- Fase 2 -->
  <rect x="240" y="70" width="190" height="110" rx="8" fill="#161b22" stroke="#00ADD8"/>
  <text x="335" y="96" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">2. Unitarios</text>
  <text x="335" y="122" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">go test -race</text>
  <text x="335" y="142" text-anchor="middle" fill="#8b949e" font-size="12">sin Docker</text>
  <text x="335" y="166" text-anchor="middle" fill="#3fb950" font-size="12">~1.5 s</text>

  <!-- Fase 3 -->
  <rect x="460" y="70" width="190" height="110" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="555" y="96" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">3. Todo + cobertura</text>
  <text x="555" y="122" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">-tags integration</text>
  <text x="555" y="142" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">-coverpkg=./...</text>
  <text x="555" y="166" text-anchor="middle" fill="#d29922" font-size="12">PostgreSQL en Docker</text>

  <!-- Fase 4 -->
  <rect x="680" y="70" width="200" height="110" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="780" y="96" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="bold">4. Umbral</text>
  <text x="780" y="122" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">go tool cover -func</text>
  <text x="780" y="142" text-anchor="middle" fill="#8b949e" font-size="12" font-family="monospace">awk: total &gt;= 85</text>
  <text x="780" y="166" text-anchor="middle" fill="#8b949e" font-size="12">exit 1 si no llega</text>

  <line x1="210" y1="125" x2="238" y2="125" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="125" x2="458" y2="125" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="125" x2="678" y2="125" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- cover.out -->
  <rect x="470" y="230" width="170" height="50" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="555" y="261" text-anchor="middle" fill="#c9d1d9" font-size="14" font-family="monospace">cover.out</text>
  <line x1="555" y1="180" x2="555" y2="228" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640,255 L780,255 L780,182" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="248" text-anchor="middle" fill="#8b949e" font-size="12">lo lee</text>

  <!-- set -euo pipefail -->
  <rect x="20" y="320" width="860" height="80" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="40" y="348" fill="#c9d1d9" font-size="14" font-family="monospace">set -euo pipefail</text>
  <text x="40" y="374" fill="#8b949e" font-size="13">-e: un comando que falla para el script. -u: una variable sin definir es un error.</text>
  <text x="40" y="392" fill="#8b949e" font-size="13">-o pipefail: en go test ... | tee log, el fallo de go test no se pierde detrás del éxito de tee.</text>
</svg>
