<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="sans-serif">
  <title>MockMvc llama al DispatcherServlet sin red; RestTestClient con RANDOM_PORT envía HTTP real a Tomcat</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#0d1117"/>
  <text x="30" y="38" fill="#c9d1d9" font-size="20" font-weight="bold">Dos formas de llegar al controlador</text>

  <!-- Fila 1: MockMvc -->
  <text x="30" y="80" fill="#58a6ff" font-size="14" font-weight="bold">MockMvc / MockMvcTester: sin red, mismo hilo que el test</text>
  <rect x="30" y="95" width="170" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="115" y="122" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="middle">Test</text>
  <text x="115" y="142" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">mvc.perform(get(...))</text>
  <line x1="200" y1="125" x2="436" y2="125" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="318" y="115" fill="#c9d1d9" font-size="12" text-anchor="middle">petición simulada</text>
  <rect x="440" y="95" width="180" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="530" y="130" fill="#c9d1d9" font-size="13" font-family="monospace" text-anchor="middle">DispatcherServlet</text>
  <line x1="620" y1="125" x2="666" y2="125" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="670" y="95" width="160" height="60" rx="8" fill="#161b22" stroke="#F89820" stroke-width="2"/>
  <text x="750" y="130" fill="#F89820" font-size="13" font-weight="bold" text-anchor="middle">Controlador</text>

  <!-- Fila 2: RestTestClient -->
  <text x="30" y="215" fill="#3fb950" font-size="14" font-weight="bold">RestTestClient + RANDOM_PORT: HTTP real por un puerto TCP</text>
  <rect x="30" y="230" width="170" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="115" y="257" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="middle">Test</text>
  <text x="115" y="277" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">client.get()...</text>
  <line x1="200" y1="260" x2="246" y2="260" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="230" width="170" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="335" y="257" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">Tomcat</text>
  <text x="335" y="277" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">localhost:36171</text>
  <line x1="420" y1="260" x2="436" y2="260" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="230" width="180" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="530" y="265" fill="#c9d1d9" font-size="13" font-family="monospace" text-anchor="middle">DispatcherServlet</text>
  <line x1="620" y1="260" x2="666" y2="260" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="670" y="230" width="160" height="60" rx="8" fill="#161b22" stroke="#F89820" stroke-width="2"/>
  <text x="750" y="265" fill="#F89820" font-size="13" font-weight="bold" text-anchor="middle">Controlador</text>

  <text x="30" y="335" fill="#c9d1d9" font-size="12">MockMvc no abre puertos: es más rápido y puede ver el handler y la excepción resuelta (andDo(print())).</text>
  <text x="30" y="357" fill="#c9d1d9" font-size="12">El servidor real prueba lo que MockMvc no ve: el puerto, Tomcat y los bytes tal como viajan por la red.</text>
  <text x="30" y="379" fill="#c9d1d9" font-size="12">El puerto cambia en cada ejecución: RANDOM_PORT evita choques con lo que ya escucha en 8080.</text>
</svg>
