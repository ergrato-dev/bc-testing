  <text x="605" y="92" fill="#F89820" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">@SpringBootTest</text>
  <text x="605" y="108" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">MOCK (por defecto)</text>
  <text x="755" y="92" fill="#F89820" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">@SpringBootTest</text>
  <text x="755" y="108" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">RANDOM_PORT</text>
