<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif">
  <title>Qué carga cada anotación de test de Spring Boot: real, mock o nada</title>
  <rect width="860" height="470" fill="#0d1117"/>
  <text x="30" y="38" fill="#c9d1d9" font-size="20" font-weight="bold">Qué arranca cada anotación de test</text>
  <text x="30" y="62" fill="#c9d1d9" font-size="13">Cuanto menos carga un slice, antes arranca y más concreto es el fallo.</text>
  <text x="305" y="92" fill="#F89820" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">@WebMvcTest</text>
