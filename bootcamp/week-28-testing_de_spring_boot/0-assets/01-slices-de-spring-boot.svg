  <text x="30" y="385" fill="#c9d1d9" font-size="13">Clock y otros @Bean</text>
  <rect x="238" y="365" width="134" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="305" y="385" fill="#c9d1d9" font-size="12" font-family="sans-serif" text-anchor="middle">no se carga</text>
