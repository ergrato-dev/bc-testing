  <text x="455" y="385" fill="#c9d1d9" font-size="12" font-family="sans-serif" text-anchor="middle">no se carga</text>
  <rect x="538" y="365" width="134" height="30" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="605" y="385" fill="#3fb950" font-size="12" font-family="sans-serif" text-anchor="middle">real</text>
  <rect x="688" y="365" width="134" height="30" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="755" y="385" fill="#3fb950" font-size="12" font-family="sans-serif" text-anchor="middle">real</text>
  <text x="30" y="428" fill="#c9d1d9" font-size="12">En @WebMvcTest los servicios no existen: o los declaras con @MockitoBean o el contexto no arranca.</text>
  <text x="30" y="448" fill="#c9d1d9" font-size="12">@SpringBootTest carga todo; con @TestBean o @MockitoBean sustituyes solo el bean que el test necesita controlar.</text>
