<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="sans-serif">
  <rect width="900" height="480" fill="#0d1117" rx="12"/>

  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#c9d1d9">Patrón AAA</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#8b949e">Arrange · Act · Assert: tres bloques en este orden</text>

  <!-- Arrange -->
  <rect x="60" y="100" width="240" height="250" rx="12" fill="#161b22" stroke="#F7DF1E" stroke-width="2"/>
  <text x="180" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#F7DF1E">Arrange (preparar)</text>
  <text x="80" y="162" font-size="12" fill="#c9d1d9">Los datos de entrada del caso</text>
  <text x="80" y="184" font-size="12" fill="#8b949e">· un valor por variable</text>
  <text x="80" y="204" font-size="12" fill="#8b949e">· con nombre que explique qué es</text>
  <rect x="78" y="236" width="204" height="94" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="92" y="262" font-size="12" fill="#c9d1d9" font-family="monospace">const a = 2;</text>
  <text x="92" y="282" font-size="12" fill="#c9d1d9" font-family="monospace">const b = 3;</text>

  <!-- Act -->
  <rect x="330" y="100" width="240" height="250" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#58a6ff">Act (actuar)</text>
  <text x="350" y="162" font-size="12" fill="#c9d1d9">Una sola llamada a lo que pruebas</text>
  <text x="350" y="184" font-size="12" fill="#8b949e">· guarda el resultado</text>
  <text x="350" y="204" font-size="12" fill="#8b949e">· sin cálculos propios</text>
  <rect x="348" y="236" width="204" height="94" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="362" y="262" font-size="12" fill="#c9d1d9" font-family="monospace">const result =</text>
  <text x="362" y="282" font-size="12" fill="#c9d1d9" font-family="monospace">  add(a, b);</text>

  <!-- Assert -->
  <rect x="600" y="100" width="240" height="250" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="720" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#3fb950">Assert (comprobar)</text>
  <text x="620" y="162" font-size="12" fill="#c9d1d9">El resultado contra el esperado</text>
  <text x="620" y="184" font-size="12" fill="#8b949e">· un valor escrito a mano</text>
  <text x="620" y="204" font-size="12" fill="#8b949e">· el matcher que corresponde</text>
  <rect x="618" y="236" width="204" height="94" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="632" y="262" font-size="12" fill="#c9d1d9" font-family="monospace">expect(result)</text>
  <text x="632" y="282" font-size="12" fill="#c9d1d9" font-family="monospace">  .toBe(5);</text>

  <!-- Flechas -->
  <line x1="300" y1="225" x2="322" y2="225" stroke="#30363d" stroke-width="2"/>
  <polygon points="330,225 320,219 320,231" fill="#8b949e"/>
  <line x1="570" y1="225" x2="592" y2="225" stroke="#30363d" stroke-width="2"/>
  <polygon points="600,225 590,219 590,231" fill="#8b949e"/>

  <!-- Nombre -->
  <rect x="60" y="375" width="780" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="401" font-size="13" fill="#c9d1d9" font-family="monospace">it("should return 5 when adding 2 and 3", () =&gt; { ... });</text>
  <text x="80" y="422" font-size="12" fill="#8b949e">El nombre dice el resultado (should) y la condición (when): se lee sin abrir el test.</text>

  <text x="450" y="463" text-anchor="middle" font-size="12" fill="#8b949e">Semana 03 · JavaScript con Jest</text>
</svg>
