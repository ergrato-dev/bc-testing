<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#0f172a" rx="12"/>
  <text x="460" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Ciclo de mutation testing con mutmut</text>
  <text x="460" y="64" text-anchor="middle" font-size="13" fill="#94a3b8">La suite se ejecuta una vez por mutante</text>
  <rect x="40" y="100" width="220" height="120" rx="10" fill="#1e293b" stroke="#3572A5"/>
  <text x="150" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD43B">1. Mutar</text>
  <text x="150" y="158" text-anchor="middle" font-size="12" fill="#f1f5f9" font-family="ui-monospace, monospace">&gt;= 100  -&gt;  &gt; 100</text>
  <text x="150" y="180" text-anchor="middle" font-size="12" fill="#f1f5f9" font-family="ui-monospace, monospace">*= 2  -&gt;  *= 3</text>
  <text x="150" y="202" text-anchor="middle" font-size="12" fill="#f1f5f9" font-family="ui-monospace, monospace">"msg"  -&gt;  "XXmsgXX"</text>
  <rect x="350" y="100" width="220" height="120" rx="10" fill="#1e293b" stroke="#3572A5"/>
  <text x="460" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#FFD43B">2. Ejecutar la suite</text>
  <text x="460" y="162" text-anchor="middle" font-size="12" fill="#f1f5f9">contra cada mutante</text>
  <text x="460" y="190" text-anchor="middle" font-size="12" fill="#cbd5e1">uv run mutmut run</text>
  <rect x="660" y="90" width="220" height="60" rx="10" fill="#14532d" stroke="#22c55e"/>
  <text x="770" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">✓ killed</text>
  <text x="770" y="137" text-anchor="middle" font-size="12" fill="#f1f5f9">algún test falló</text>
  <rect x="660" y="170" width="220" height="60" rx="10" fill="#450a0a" stroke="#ef4444"/>
  <text x="770" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">✗ survived</text>
  <text x="770" y="217" text-anchor="middle" font-size="12" fill="#f1f5f9">todos los tests pasaron</text>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="260" y1="160" x2="346" y2="160"/>
    <line x1="570" y1="145" x2="656" y2="122"/>
    <line x1="570" y1="175" x2="656" y2="198"/>
    <line x1="770" y1="230" x2="770" y2="276"/>
  </g>
  <rect x="470" y="280" width="410" height="60" rx="10" fill="#1e293b" stroke="#6366f1"/>
  <text x="675" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#a5b4fc">3. Revisar: uv run mutmut show &lt;mutante&gt;</text>
  <text x="675" y="326" text-anchor="middle" font-size="12" fill="#f1f5f9">¿algún test podría distinguirlo del original?</text>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="600" y1="340" x2="360" y2="380"/>
    <line x1="750" y1="340" x2="750" y2="376"/>
  </g>
  <rect x="120" y="380" width="340" height="70" rx="10" fill="#1e293b" stroke="#22c55e"/>
  <text x="290" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#22c55e">Sí: matable</text>
  <text x="290" y="430" text-anchor="middle" font-size="12" fill="#f1f5f9">test de frontera, valor exacto, match anclado</text>
  <rect x="560" y="380" width="320" height="70" rx="10" fill="#1e293b" stroke="#94a3b8"/>
  <text x="720" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#cbd5e1">No: equivalente</text>
  <text x="720" y="430" text-anchor="middle" font-size="12" fill="#f1f5f9">documentarlo en el reporte</text>
  <text x="460" y="480" text-anchor="middle" font-size="12" fill="#94a3b8">En Windows, mutmut se ejecuta dentro de WSL (necesita fork).</text>
</svg>
