[project]
name = "week21-ejercicio02-solution"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "mutmut==3.8.0"]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/"]
