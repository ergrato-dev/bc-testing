<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="sans-serif">
  <rect width="860" height="500" fill="#0d1117"/>

  <text x="430" y="40" text-anchor="middle" fill="#c9d1d9" font-size="20" font-weight="bold">Análisis de valores límite</text>
  <text x="430" y="64" text-anchor="middle" fill="#8b949e" font-size="13">Campo "Edad": acepta enteros de 18 a 65</text>

  <!-- Zonas -->
  <text x="125" y="112" text-anchor="middle" fill="#f85149" font-size="12">Inválida (&lt; 18)</text>
  <text x="430" y="112" text-anchor="middle" fill="#3fb950" font-size="12">Válida (18 a 65)</text>
  <text x="745" y="112" text-anchor="middle" fill="#f85149" font-size="12">Inválida (&gt; 65)</text>
  <rect x="50" y="124" width="150" height="14" fill="#161b22" stroke="#f85149"/>
  <rect x="200" y="124" width="460" height="14" fill="#161b22" stroke="#3fb950"/>
  <rect x="660" y="124" width="150" height="14" fill="#161b22" stroke="#f85149"/>

  <!-- Puntos: sólidos = 2 valores; discontinuos = los que añade el de 3 valores -->
  <circle cx="170" cy="131" r="9" fill="#f85149" stroke="#c9d1d9" stroke-width="2"/>
  <circle cx="230" cy="131" r="9" fill="#3fb950" stroke="#c9d1d9" stroke-width="2"/>
  <circle cx="290" cy="131" r="9" fill="#161b22" stroke="#3fb950" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="570" cy="131" r="9" fill="#161b22" stroke="#3fb950" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="630" cy="131" r="9" fill="#3fb950" stroke="#c9d1d9" stroke-width="2"/>
  <circle cx="690" cy="131" r="9" fill="#f85149" stroke="#c9d1d9" stroke-width="2"/>

  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="170" y="170" fill="#f85149">17</text>
    <text x="230" y="170" fill="#3fb950">18</text>
    <text x="290" y="170" fill="#3fb950">19</text>
    <text x="570" y="170" fill="#3fb950">64</text>
    <text x="630" y="170" fill="#3fb950">65</text>
    <text x="690" y="170" fill="#f85149">66</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8b949e">
    <text x="170" y="188">rechaza</text>
    <text x="230" y="188">acepta</text>
    <text x="290" y="188">acepta</text>
    <text x="570" y="188">acepta</text>
    <text x="630" y="188">acepta</text>
    <text x="690" y="188">rechaza</text>
  </g>

  <!-- Leyenda -->
  <rect x="50" y="210" width="760" height="64" fill="#161b22" stroke="#30363d" rx="6"/>
  <circle cx="76" cy="231" r="7" fill="#3fb950" stroke="#c9d1d9" stroke-width="2"/>
  <text x="92" y="235" fill="#c9d1d9" font-size="13">BVA de 2 valores: el límite y su vecino del otro lado (17, 18, 65, 66)</text>
  <circle cx="76" cy="255" r="7" fill="#161b22" stroke="#3fb950" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="92" y="259" fill="#c9d1d9" font-size="13">BVA de 3 valores: añade el vecino de dentro de cada límite (19, 64)</text>

  <!-- Tabla -->
  <rect x="50" y="292" width="760" height="30" fill="#161b22" stroke="#30363d"/>
  <g font-size="13" font-weight="bold" fill="#8b949e">
    <text x="70" y="312">Valor</text>
    <text x="170" y="312">Posición</text>
    <text x="520" y="312">Variante</text>
    <text x="680" y="312">Resultado</text>
  </g>
  <g font-size="13" fill="#c9d1d9">
    <text x="70" y="344" fill="#f85149">17</text><text x="170" y="344">Vecino de fuera del mínimo</text><text x="520" y="344">2 y 3 valores</text><text x="680" y="344" fill="#f85149">Rechazado</text>
    <text x="70" y="370" fill="#3fb950">18</text><text x="170" y="370">Límite mínimo</text><text x="520" y="370">2 y 3 valores</text><text x="680" y="370" fill="#3fb950">Aceptado</text>
    <text x="70" y="396" fill="#3fb950">19</text><text x="170" y="396">Vecino de dentro del mínimo</text><text x="520" y="396">solo 3 valores</text><text x="680" y="396" fill="#3fb950">Aceptado</text>
    <text x="70" y="422" fill="#3fb950">64</text><text x="170" y="422">Vecino de dentro del máximo</text><text x="520" y="422">solo 3 valores</text><text x="680" y="422" fill="#3fb950">Aceptado</text>
    <text x="70" y="448" fill="#3fb950">65</text><text x="170" y="448">Límite máximo</text><text x="520" y="448">2 y 3 valores</text><text x="680" y="448" fill="#3fb950">Aceptado</text>
    <text x="70" y="474" fill="#f85149">66</text><text x="170" y="474">Vecino de fuera del máximo</text><text x="520" y="474">2 y 3 valores</text><text x="680" y="474" fill="#f85149">Rechazado</text>
  </g>
</svg>
