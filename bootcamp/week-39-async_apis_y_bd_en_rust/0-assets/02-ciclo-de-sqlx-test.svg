<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="sans-serif">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="20" font-weight="bold" text-anchor="middle">El ciclo de una base de datos de #[sqlx::test]</text>

  <!-- Servidor -->
  <rect x="30" y="70" width="190" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="125" y="98" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <text x="125" y="120" fill="#c9d1d9" font-size="12" text-anchor="middle">el de compose.yaml</text>
  <text x="125" y="146" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">DATABASE_URL</text>
  <text x="125" y="164" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">127.0.0.1:55432</text>

  <!-- Pasos -->
  <rect x="260" y="70" width="140" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="330" y="98" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">1. Crear</text>
  <text x="330" y="122" fill="#c9d1d9" font-size="12" text-anchor="middle">una base nueva</text>
  <text x="330" y="140" fill="#c9d1d9" font-size="12" text-anchor="middle">para el test</text>

  <rect x="430" y="70" width="140" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="500" y="98" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">2. Migrar</text>
  <text x="500" y="122" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">migrations/</text>
  <text x="500" y="140" fill="#c9d1d9" font-size="12" text-anchor="middle">y las fixtures</text>

  <rect x="600" y="70" width="140" height="110" rx="8" fill="#161b22" stroke="#DEA584" stroke-width="2"/>
  <text x="670" y="98" fill="#DEA584" font-size="14" font-weight="bold" text-anchor="middle">3. Ejecutar</text>
  <text x="670" y="122" fill="#c9d1d9" font-size="12" text-anchor="middle">el test recibe</text>
  <text x="670" y="140" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">pool: PgPool</text>

  <line x1="220" y1="125" x2="254" y2="125" stroke="#30363d" stroke-width="2"/>
  <polygon points="254,120 262,125 254,130" fill="#30363d"/>
  <line x1="400" y1="125" x2="424" y2="125" stroke="#30363d" stroke-width="2"/>
  <polygon points="424,120 432,125 424,130" fill="#30363d"/>
  <line x1="570" y1="125" x2="594" y2="125" stroke="#30363d" stroke-width="2"/>
  <polygon points="594,120 602,125 594,130" fill="#30363d"/>

  <!-- Resultado -->
  <line x1="620" y1="180" x2="620" y2="224" stroke="#3fb950" stroke-width="2"/>
  <polygon points="615,224 620,232 625,224" fill="#3fb950"/>
  <line x1="720" y1="180" x2="720" y2="224" stroke="#f85149" stroke-width="2"/>
  <polygon points="715,224 720,232 725,224" fill="#f85149"/>

  <rect x="430" y="232" width="210" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="535" y="260" fill="#3fb950" font-size="14" font-weight="bold" text-anchor="middle">Pasa: se borra</text>
  <text x="535" y="284" fill="#c9d1d9" font-size="12" text-anchor="middle">no queda nada en el servidor</text>

  <rect x="660" y="232" width="210" height="148" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="765" y="260" fill="#f85149" font-size="14" font-weight="bold" text-anchor="middle">Falla: se queda</text>
  <text x="765" y="284" fill="#c9d1d9" font-size="12" text-anchor="middle">registrada en</text>
  <text x="765" y="304" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">_sqlx_test.databases</text>
  <text x="765" y="324" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">(db_name, test_path)</text>
  <text x="765" y="350" fill="#c9d1d9" font-size="12" text-anchor="middle">se borra cuando ese</text>
  <text x="765" y="368" fill="#c9d1d9" font-size="12" text-anchor="middle">test vuelve a ejecutarse</text>

  <!-- Paralelo -->
  <rect x="30" y="230" width="370" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="215" y="256" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">Tests en paralelo, cada uno en su base</text>
  <rect x="50" y="272" width="330" height="28" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="215" y="291" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">saves_and_finds      → _sqlx_test_gi9w…</text>
  <rect x="50" y="306" width="330" height="28" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="215" y="325" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">save_twice_updates   → _sqlx_test_…</text>
  <rect x="50" y="340" width="330" height="28" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="215" y="359" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">unknown_code_is_none → _sqlx_test_…</text>
</svg>
