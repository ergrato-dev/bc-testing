<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="sans-serif">
  <title>De la regla al test: riesgo, caso y tests en tres lenguajes</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="20" font-weight="bold" text-anchor="middle">De la regla al test</text>

  <!-- Regla -->
  <rect x="30" y="70" width="190" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="125" y="98" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">Regla R4</text>
  <text x="125" y="122" fill="#c9d1d9" font-size="13" text-anchor="middle">Grupo escolar:</text>
  <text x="125" y="142" fill="#c9d1d9" font-size="13" text-anchor="middle">menores de 18 años</text>

  <!-- Riesgo -->
  <rect x="30" y="200" width="190" height="130" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="125" y="228" fill="#d29922" font-size="15" font-weight="bold" text-anchor="middle">Riesgo K1</text>
  <text x="125" y="252" fill="#c9d1d9" font-size="13" text-anchor="middle">Impacto: Alto</text>
  <text x="125" y="274" fill="#c9d1d9" font-size="13" text-anchor="middle">Probabilidad: Media</text>
  <text x="125" y="306" fill="#f85149" font-size="14" font-weight="bold" text-anchor="middle">Prioridad: Alta</text>

  <!-- Caso -->
  <rect x="290" y="130" width="200" height="110" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="390" y="160" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">Caso</text>
  <text x="390" y="186" fill="#c9d1d9" font-size="13" font-family="monospace" text-anchor="middle">TC-PLAN-008</text>
  <text x="390" y="208" fill="#c9d1d9" font-size="13" text-anchor="middle">Grupo escolar, 18 años</text>
  <text x="390" y="228" fill="#c9d1d9" font-size="13" text-anchor="middle">Alta · en los tres lenguajes</text>

  <line x1="220" y1="115" x2="286" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="265" x2="286" y2="212" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tests -->
  <rect x="560" y="60" width="310" height="70" rx="8" fill="#161b22" stroke="#F7DF1E"/>
  <text x="580" y="88" fill="#F7DF1E" font-size="14" font-weight="bold">JavaScript · js/tests</text>
  <text x="580" y="112" fill="#c9d1d9" font-size="13" font-family="monospace">// TC-PLAN-008  it("should ...")</text>

  <rect x="560" y="150" width="310" height="70" rx="8" fill="#161b22" stroke="#3572A5"/>
  <text x="580" y="178" fill="#3572A5" font-size="14" font-weight="bold">Python · python/tests</text>
  <text x="580" y="202" fill="#c9d1d9" font-size="13" font-family="monospace"># TC-PLAN-008  def test_...</text>

  <rect x="560" y="240" width="310" height="70" rx="8" fill="#161b22" stroke="#F89820"/>
  <text x="580" y="268" fill="#F89820" font-size="14" font-weight="bold">Java · java/src/test</text>
  <text x="580" y="292" fill="#c9d1d9" font-size="13" font-family="monospace">// TC-PLAN-008  @Test void should...</text>

  <line x1="490" y1="170" x2="556" y2="98" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="185" x2="556" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="200" x2="556" y2="272" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- verify -->
  <text x="715" y="350" fill="#3fb950" font-size="13" text-anchor="middle"><tspan font-family="monospace">verify.sh</tspan> comprueba cada flecha</text>
  <text x="125" y="360" fill="#8b949e" font-size="12" text-anchor="middle">La prioridad del caso es la de su riesgo</text>
</svg>
