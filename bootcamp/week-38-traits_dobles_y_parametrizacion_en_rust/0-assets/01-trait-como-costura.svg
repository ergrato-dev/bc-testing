<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="sans-serif">
  <rect width="900" height="440" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="20" font-weight="bold" text-anchor="middle">El trait como costura</text>

  <!-- Servicio -->
  <rect x="300" y="60" width="300" height="90" rx="8" fill="#161b22" stroke="#DEA584" stroke-width="2"/>
  <text x="450" y="90" fill="#DEA584" font-size="16" font-weight="bold" text-anchor="middle">LoanDesk&lt;R, N&gt;</text>
  <text x="450" y="114" fill="#c9d1d9" font-size="13" font-family="monospace" text-anchor="middle">registry: R</text>
  <text x="450" y="134" fill="#c9d1d9" font-size="13" font-family="monospace" text-anchor="middle">notifier: N</text>

  <!-- Traits -->
  <line x1="390" y1="150" x2="230" y2="200" stroke="#30363d" stroke-width="2"/>
  <line x1="510" y1="150" x2="670" y2="200" stroke="#30363d" stroke-width="2"/>
  <text x="270" y="172" fill="#8b949e" font-size="12" font-family="monospace">R: Registry</text>
  <text x="565" y="172" fill="#8b949e" font-size="12" font-family="monospace">N: Notifier</text>

  <rect x="80" y="200" width="300" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="230" y="226" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">trait Registry</text>
  <text x="230" y="248" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">fn is_accredited(&amp;self, ..) -&gt; bool</text>

  <rect x="520" y="200" width="300" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="670" y="226" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">trait Notifier</text>
  <text x="670" y="248" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">fn send(&amp;self, ..) -&gt; Result</text>

  <!-- Implementaciones Registry -->
  <line x1="160" y1="260" x2="160" y2="300" stroke="#30363d" stroke-width="2"/>
  <line x1="300" y1="260" x2="300" y2="300" stroke="#30363d" stroke-width="2"/>
  <rect x="80" y="300" width="150" height="56" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="155" y="324" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">Producción</text>
  <text x="155" y="344" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">registro real</text>
  <rect x="240" y="300" width="140" height="56" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="310" y="324" fill="#d29922" font-size="13" font-weight="bold" text-anchor="middle">Stub</text>
  <text x="310" y="344" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">StubRegistry</text>

  <!-- Implementaciones Notifier -->
  <line x1="580" y1="260" x2="580" y2="300" stroke="#30363d" stroke-width="2"/>
  <line x1="680" y1="260" x2="680" y2="300" stroke="#30363d" stroke-width="2"/>
  <line x1="780" y1="260" x2="780" y2="300" stroke="#30363d" stroke-width="2"/>
  <rect x="520" y="300" width="100" height="56" rx="6" fill="#161b22" stroke="#3fb950"/>
  <text x="570" y="324" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">Producción</text>
  <text x="570" y="344" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">correo</text>
  <rect x="628" y="300" width="100" height="56" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="678" y="324" fill="#d29922" font-size="13" font-weight="bold" text-anchor="middle">Fake</text>
  <text x="678" y="344" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">FakeNotifier</text>
  <rect x="736" y="300" width="100" height="56" rx="6" fill="#161b22" stroke="#f85149"/>
  <text x="786" y="324" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">Mock</text>
  <text x="786" y="344" fill="#c9d1d9" font-size="11" font-family="monospace" text-anchor="middle">MockNotifier</text>

  <!-- Pie -->
  <text x="450" y="392" fill="#c9d1d9" font-size="13" text-anchor="middle">Cada caja de abajo es un tipo con su propio bloque impl Trait for Tipo.</text>
  <text x="450" y="414" fill="#8b949e" font-size="13" text-anchor="middle">En el test, LoanDesk&lt;StubRegistry, FakeNotifier&gt; conserva los tipos concretos.</text>
</svg>
