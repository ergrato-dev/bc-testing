<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="sans-serif">
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="20" font-weight="bold" text-anchor="middle">El ciclo de un snapshot con insta</text>

  <!-- 1. cargo test -->
  <rect x="40" y="80" width="220" height="90" rx="8" fill="#161b22" stroke="#DEA584" stroke-width="2"/>
  <text x="150" y="110" fill="#DEA584" font-size="15" font-weight="bold" text-anchor="middle">1. cargo test</text>
  <text x="150" y="134" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">assert_snapshot!(salida)</text>
  <text x="150" y="156" fill="#8b949e" font-size="12" text-anchor="middle">compara con el .snap</text>

  <!-- 2a. coincide -->
  <line x1="260" y1="110" x2="610" y2="110" stroke="#3fb950" stroke-width="2"/>
  <polygon points="610,104 622,110 610,116" fill="#3fb950"/>
  <text x="440" y="100" fill="#3fb950" font-size="13" text-anchor="middle">coincide</text>
  <rect x="625" y="80" width="235" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="742" y="106" fill="#3fb950" font-size="15" font-weight="bold" text-anchor="middle">ok</text>
  <text x="742" y="127" fill="#8b949e" font-size="12" text-anchor="middle">no se escribe nada</text>

  <!-- 2b. distinto o no existe -->
  <line x1="150" y1="170" x2="150" y2="230" stroke="#f85149" stroke-width="2"/>
  <polygon points="144,230 150,242 156,230" fill="#f85149"/>
  <text x="160" y="205" fill="#f85149" font-size="13">no existe o es distinto</text>
  <rect x="40" y="245" width="220" height="90" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="150" y="273" fill="#f85149" font-size="15" font-weight="bold" text-anchor="middle">2. FAILED + diff</text>
  <text x="150" y="297" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">tests/snapshots/</text>
  <text x="150" y="317" fill="#c9d1d9" font-size="12" font-family="monospace" text-anchor="middle">x__y.snap.new</text>

  <!-- 3. review -->
  <line x1="260" y1="290" x2="335" y2="290" stroke="#30363d" stroke-width="2"/>
  <polygon points="335,284 347,290 335,296" fill="#30363d"/>
  <rect x="350" y="245" width="220" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="273" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">3. cargo insta review</text>
  <text x="460" y="297" fill="#c9d1d9" font-size="12" text-anchor="middle">a acepta · r rechaza · s salta</text>
  <text x="460" y="317" fill="#8b949e" font-size="12" text-anchor="middle">(o cargo insta accept)</text>

  <!-- 4. accept -->
  <line x1="570" y1="290" x2="610" y2="290" stroke="#30363d" stroke-width="2"/>
  <polygon points="610,284 622,290 610,296" fill="#30363d"/>
  <rect x="625" y="245" width="235" height="90" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="742" y="273" fill="#d29922" font-size="15" font-weight="bold" text-anchor="middle">4. a: .snap.new → .snap</text>
  <text x="742" y="297" fill="#c9d1d9" font-size="12" text-anchor="middle">se sube con el código</text>
  <text x="742" y="317" fill="#8b949e" font-size="12" text-anchor="middle">el próximo cargo test pasa</text>

  <text x="450" y="378" fill="#8b949e" font-size="13" text-anchor="middle">Con la variable CI definida, el paso 2 no escribe .snap.new: el test solo falla con el diff.</text>
</svg>
