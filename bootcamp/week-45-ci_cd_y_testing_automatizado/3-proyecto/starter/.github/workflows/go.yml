# Suite de Go: el modelo de los otros cuatro workflows. Ejecuta go/verify.sh, que ya hace vet,
# staticcheck, unitarios, integración con testcontainers-go y el umbral del 85 %.
name: go

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go version
      - run: bash verify.sh
      - name: Coverage report
        if: always()
        run: test -f cover.out && go tool cover -html=cover.out -o coverage.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-go
          path: |
            go/cover.out
            go/coverage.html
          if-no-files-found: ignore
          retention-days: 14
