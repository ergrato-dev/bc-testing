# PostgreSQL para los tests de Go en tu equipo. En GitHub Actions lo arranca el workflow.
name: ci-lab
services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "127.0.0.1:55445:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U library -d library"]
      interval: 1s
      timeout: 3s
      retries: 60
